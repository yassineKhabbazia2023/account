trigger: none
pool:
  vmImage: windows-latest

parameters:
- name: devIndex
  displayName: 'Index de l environnement cible (seulement pour un déploiement sur env de DEV)'
  type: number
  default: 0
- name: deployType
  displayName: "Technical parameter : don t modify it !"
  type: string
  default: 'standard'

resources:
  repositories:
  - repository: Pulse
    name: 'Pulse.ConstellationDevOps'
    type: git
    ref: 'refs/heads/Release/v2.0'

extends:
  template: pipelines/templates/platform.back.sql.yaml@Pulse
  parameters:
    devIndex: ${{ parameters.devIndex }}
    deployType: ${{ parameters.deployType }}
    sonarExclusions: '**/Account.Database/ScriptRec/**, **/Account.Database/postDeployment/**'
    domain: acc
    resource:
      id: '01'
      name: 'account'
      path: 01_account\src\Account.Database\Account.Database.sqlproj
    dotnetcore: 8.x