trigger: none

pool:
  vmImage: 'ubuntu-latest'

parameters:
- name: deployToDev
  displayName: 'Déployer sur DEV'
  type: boolean
  default: false
- name: deployToItg
  type: string
  displayName: 'Déployer sur ITG'
  values:
  - no
  - itg01
  - itg02
  default: 'itg01'

resources:
  repositories:
  - repository: Pulse
    name: 'Pulse.Operations.Pipelines'
    type: git
    ref: 'refs/heads/Release/v4.0'

extends:
  template: pipelines/quick-build/back.yaml@Pulse
  parameters:
    deployToDev: ${{ parameters.deployToDev }}
    deployToItg: ${{ parameters.deployToItg }}
    srcPath: 01_account/src/Account.API/Account.API.csproj
    domain: acc
    name: account
    appType: webApp
    id: '01'